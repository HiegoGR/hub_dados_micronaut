micronaut.application.name=hub_dados

#Banco de Dados DB2
#datasources.default.password=
#datasources.default.dialect=H2
#datasources.default.url=jdbc\:h2\:mem\:devDb;LOCK_TIMEOUT\=10000;DB_CLOSE_ON_EXIT\=FALSE
#jpa.default.properties.hibernate.hbm2ddl.auto=update
#datasources.default.username=sa
#datasources.default.driver-class-name=org.h2.Driver

#Swagger
micronaut.router.static-resources.swagger.paths=classpath\:META-INF/swagger
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
micronaut.router.static-resources.swagger-ui.paths=classpath\:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger.mapping=/swagger/**

# HTTP Clients (Micronaut way)
micronaut.http.services.viacep.url=https://viacep.com.br/ws
micronaut.http.services.brasilapi.url=https://brasilapi.com.br/api
micronaut.http.services.parallelumfipeapi.url=https://fipe.parallelum.com.br/api/v2

micronaut.http.services.viacep.read-timeout=5s
micronaut.http.services.brasilapi.read-timeout=5s
micronaut.http.services.parallelumfipeapi.read-timeout=5s

# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.streams.enabled=false